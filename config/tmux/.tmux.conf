# ref
  # https://github.com/kevinhwang91/dotfiles/blob/main/tmux/tmux.conf
  # https://github.com/theniceboy/.config/blob/master/.tmux.conf
  # https://github.com/leoatchina/leotmux/blob/master/tmux.conf
  # https://man.openbsd.org/OpenBSD-current/man1/tmux.1

# -- general

set -s escape-time 0          # no delay after Esc: nvim feels broken otherwise
set -sg repeat-time 300
set -s focus-events on        # required by nvim autoread AND by adx's "seen" hook
set -g mouse on
set -sg exit-empty on
setw -g xterm-keys on

set -g visual-activity off
setw -g monitor-activity off
setw -g monitor-bell off

# One agent turn can print more than 10k lines. Scrollback is the only record of
# what it did before you looked, so it is worth the memory.
set -g history-limit 100000
set -s set-clipboard on

# FIXED: this was /run/current-system/sw/bin/elvish — a NixOS path that does not
# exist on this machine, so tmux had to fall back to something else to open a
# pane at all. Your shell is zsh (you migrated off elvish); $SHELL is honoured
# when default-shell is empty, which is the least surprising setting of the two.
set -g default-shell /bin/zsh

set -g default-terminal "tmux-256color"
# terminal-features replaces the old terminal-overrides incantations (tmux 3.2+):
# it says what the OUTER terminal can do, and Ghostty can do true colour.
set -as terminal-features ",*:RGB"
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'   # cursor shape for nvim
set-environment -g COLORTERM "truecolor"

# reload configuration
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'

# -- prefix
unbind C-b
set -g prefix 'M-`'

# -- keys (unchanged: same muscle memory as before)
# New window, then name it right away — herdr's prompt-on-new-tab, which is what
# makes a window list worth reading. Esc keeps tmux's automatic name.
bind t new-window -c "#{pane_current_path}" \; display-popup -E -w 50% -h 20% 'adx rename --suggest-dir --title "Name this window"'

bind n splitw -h -c "#{pane_current_path}"
bind l next-window
bind h previous-window
bind w kill-pane
bind j select-pane -L
bind k select-pane -R
unbind z
bind f resize-pane -Z # full pane

# -- keys (added)
# You could only ever split horizontally; this is the missing other half.
bind v splitw -v -c "#{pane_current_path}"
# Arrows move between panes in the directions j/k do not cover, repeatable.
bind -r Left  select-pane -L
bind -r Right select-pane -R
bind -r Up    select-pane -U
bind -r Down  select-pane -D
# Jump straight to a window without the prefix. With one agent per window this
# is the fastest switch there is; M-o (below) is for when you want to search.
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# vi keys in copy mode, since everything else you use is vi keys.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi Escape send -X cancel

# -- display
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# A tab label should be the task, and a task does not change name because you
# cd'd. With automatic-rename on, tmux recomputes the name from the active pane
# forever — it only stops for a window you renamed by hand. Off means the name
# you give a window is the name it keeps; `bind t` asks for one at birth and
# `prefix ,` changes it later.
setw -g automatic-rename off
set -g set-titles on
set -g display-panes-time 2000
set -g display-time 2000

# Every status-interval tick runs the #(…) commands in the status line. adx's
# fleet summary is one of them, so this is a real cost: 1s was gratuitous, 2s is
# below the threshold where you would notice the counter lagging.
set -g status-interval 2

# statusbar
#
# No absolute colours for the BAR itself: you switch between light and dark
# themes, and any fixed background is wrong in one of them (a black bar under a
# light theme, a white one under dark). bg=default means the bar is whatever the
# terminal is, so it follows the theme without anyone asking the terminal what
# the theme is — which is a question with no safe way to ask.
#
# fg=default matters too: tmux's own default status style is fg=black,bg=green,
# so setting only the background once left this bar black-on-black. Everything
# below names its own foreground, which hid that until something used default.
set -g status-style fg=default,bg=default
set -g status-justify centre
set -g status-left '#[fg=brightblack] #S '
# red rather than brightyellow: the prefix indicator has to be visible on a
# light terminal too, and yellow on white is not.
set -g status-right '#[fg=red,bold] #{?client_prefix,⌨ ,  }  #[fg=magenta] %Y-%m-%d %H:%M '
set -wg window-status-format '#[fg=magenta] #I #W'
set -wg window-status-current-format '#[fg=brightblue,bold] #I #W'
set -wg window-status-activity-style bg=default
set -wg window-status-bell-style bg=default

# floating popup (toggle with prefix + i)
bind i if-shell -F '#{==:#{session_name},floating}' {
    detach-client
} {
    display-popup -d "#{pane_current_path}" -xC -yC -w 80% -h 60% -E "tmux new-session -A -s floating"
}
