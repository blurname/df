onboarding = false
# herdr config — migrated from zellij habits (~/.config/zellij/config.kdl)

[theme]
# 终端是浅色背景，默认的 catppuccin（深色系）在白底上对比度不够
name = "catppuccin-latte"
# 跟随系统明暗自动切换
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "catppuccin"

[terminal]
# default_shell = "/bin/elvish"
new_cwd = "follow"  # 新 pane/tab/workspace 继承来源 pane 的 cwd（zellij 同款行为）

[keys]
# zellij: "Alt `" 进入 tmux mode -> herdr prefix
# 如果你的终端吃掉了 alt+backtick，改回 "ctrl+b" 或试 "f12"
prefix = "alt+backtick"

# zellij tmux-mode 习惯映射
detach = "prefix+shift+d"
new_tab = "prefix+t"             # zellij: t (NewTab)
previous_tab = "prefix+h"        # zellij: h (GoToPreviousTab)
next_tab = "prefix+l"            # zellij: l (GoToNextTab)
switch_tab = "prefix+1..9"       # zellij: 1-8 (GoToTab)
close_pane = "prefix+w"          # zellij: w (CloseFocus)
split_vertical = "prefix+n"      # zellij: n (NewPane right)
rename_tab = "prefix+r"          # 默认 prefix+shift+t，太绕
resize_mode = "prefix+plus"      # 给 rename_tab 让出 prefix+r（zellij 里也是 = / - 调大小）
zoom = "prefix+f"                # zellij: f (ToggleFocusFullscreen)
edit_scrollback = "prefix+e"     # zellij: e (EditScrollback)
workspace_picker = "prefix+space" # 进入 Herdr 持久 Navigate 模式；Esc/prefix 退出
                                  # （prefix+p 让给了 adx hub，见下面 [[keys.command]]）
last_pane = "prefix+backtick"    # zellij: ` (ToggleTab 的近似)
cycle_pane_next = "prefix+j"     # zellij: j (FocusNextPane)
cycle_pane_previous = "prefix+k" # zellij: k (FocusPreviousPane)

# agent 列表上移/下移

next_agent= "prefix+comma"
previous_agent= "prefix+period"

# h/j/k/l 被上面占用，方向聚焦改用方向键
focus_pane_left = "prefix+left"
focus_pane_down = "prefix+down"
focus_pane_up = "prefix+up"
focus_pane_right = "prefix+right"

# Navigate 模式内的本地键，不需要再按 prefix；用于连续浏览 pane。
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"
navigate_workspace_up = "up"
navigate_workspace_down = "down"

# 项目一键切换 pnpm dev（停别处、在当前 tab 复用/新开 pane 启动）；参数是项目目录名前缀
[[keys.command]]
key = "prefix+d"
type = "shell"
command = "$HOME/df/config/herdr/dev-switch.sh voyager"

# adx 插件（~/prj/adx，herdr plugin link）：一个 popup 装三个视图，alt-h/l 或 alt-1..3 切换。
#   1 agents  跳 agent pane，按 blocked → done → working → idle 排序，输入即搜索
#   2 top     进程树，为清理而生（杀子树、找占端口的孤儿）
#   3 gh      GitHub 上等你动手的东西
# 单个视图也各有一个 action（blurname.adx.{agent,top,gh}），没绑键，从 herdr 的 action 菜单走。
# ssh 是 blurname.adx.ssh，故意不在 hub 里：它的 Enter 是 exec，会开成一个独立 tab。
# lazygit,开在按键时焦点 pane 所在的仓库。
# 走 adx 插件是因为机制上必须:type="shell" 的键绑定没有终端,装不下 TUI;
# 而 overlay 只有插件能开(pane.split 不接 placement,plugin.pane.open 接)。
# adx 补的是**目录**——插件 pane 默认起在 workspace 的 cwd,不是你刚才看的那个 pane。
[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "blurname.adx.git"
description = "lazygit: this pane's repo"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "blurname.adx.hub"
description = "adx: agents / processes / github"

[ui]
agent_panel_sort = "priority"

show_agent_labels_on_pane_borders = false
status_indicators = "symbols"
[ui.toast]
# dev-switch.sh 用应用内 toast 反馈结果
delivery = "off"

[ui.sound]
enabled = false

[experimental]
# macOS: prefix mode 自动切 ASCII 输入源目前对微信输入法恢复不稳定，先关闭。
switch_ascii_input_source_in_prefix = true
